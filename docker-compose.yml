services:
  backend:
    build:
      context: .
      dockerfile: dockerfile
    ports:
      - "8080:8080"
    volumes:
      - .:/app                      # mount โค้ดเข้า container
    environment:
      PORT: 8080
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: 1234
      DB_NAME: backend
    depends_on:
      - db

  db:
    image: mysql:8.0
    ports:
      - "3306:3306"   # เปิดไว้ให้ต่อด้วย DBeaver/TablePlus ตอน dev
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: backend